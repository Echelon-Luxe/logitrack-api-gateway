name: CI

on:
  pull_request:
    branches: [dev, staging, production]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------- quality ---
  quality:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ------------------------------------------------------- secret scanning ---
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the working tree

      # The gitleaks action needs a paid licence for orgs; the binary does not.
      - name: Install gitleaks
        run: |
          VERSION=8.24.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  # --------------------------------------------------- dependency scanning ---
  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Blocking gate covers only what ships; Trivy scans the built image below.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high || true
  # ------------------------------------------------------------- image ---
  image:
    name: build / scan / push image
    runs-on: ubuntu-latest
    needs: [quality, secrets, dependencies]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Full commit SHA, never `latest`: mutable tags cannot be rolled back.
      - name: Compute image reference
        id: ref
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Built locally first so Trivy can block before anything reaches GHCR.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
          format: spdx-json
          artifact-name: sbom-${{ steps.ref.outputs.tag }}.spdx.json

      # Push only on merge to dev, never from a PR.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: docker push ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}

      # Hand the SHA to the infrastructure repository, which decides what runs
      # where. This repo never holds cluster credentials - only the right to say
      # "this image exists".
      #
      # GITHUB_TOKEN cannot dispatch across repositories, so this needs a PAT with
      # `repo` scope on logitrack-infrastructure, stored as INFRA_DISPATCH_TOKEN.
      - name: Trigger deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          gh api repos/Echelon-Luxe/logitrack-infrastructure/dispatches -f event_type=deploy -F 'client_payload[service]=api-gateway' -F 'client_payload[image_tag]=${{ steps.ref.outputs.tag }}'

  # ------------------------------------------------------------ slack alert ---
  # Failures on any run, plus a "merged to dev" note when the image was pushed
  # and the deploy dispatched. Successful PR runs stay quiet; slack-pr.yml
  # covers PR opened/merged/closed. Skipped when the webhook secret is absent
  # (fork PRs, Dependabot) and never fails the run itself.
  notify:
    name: slack alert
    runs-on: ubuntu-latest
    needs: [quality, secrets, dependencies, image]
    if: always()
    permissions: {}
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEEDS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          set -euo pipefail
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo "No Slack webhook configured; skipping."; exit 0; }

          # Slack mrkdwn treats & < > as markup; PR titles and commit messages are untrusted.
          esc() { sed -e 's/\\/\\\\/g' -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          failed=$(jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")' <<<"${NEEDS}")
          image=$(jq -r '.image.result' <<<"${NEEDS}")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            where="PR <${PR_URL}|#${PR_NUMBER} $(printf '%s' "${PR_TITLE}" | esc)> -> \`$(printf '%s' "${PR_BASE}" | esc)\`"
          else
            where="<${COMMIT_URL}|${GITHUB_SHA:0:7}> $(printf '%s' "${COMMIT_MSG}" | head -n1 | esc)"
          fi

          if [ -n "${failed}" ]; then
            text=":x: *CI failed* in \`${GITHUB_REPOSITORY}\` (${failed})\n${where}\nby ${GITHUB_ACTOR} - <${run_url}|view run>"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/dev" ] && [ "${image}" = "success" ]; then
            text=":rocket: *Merged to dev* in \`${GITHUB_REPOSITORY}\` - image \`${GITHUB_SHA:0:7}\` pushed, deploy dispatched\n${where}\nby ${GITHUB_ACTOR} - <${run_url}|view run>"
          else
            echo "Nothing to report (failed='${failed}', image='${image}')."
            exit 0
          fi

          # printf %b expands the \n sequences above; jq does the JSON escaping.
          jq -n --arg text "$(printf '%b' "${text}")" '{text: $text}' \
            | curl -sS -f -X POST -H 'Content-type: application/json' --data @- "${SLACK_WEBHOOK_URL}" \
            || echo "::warning::Slack notification failed"
